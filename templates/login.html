{% extends "base.html" %}

{% block title %}Login - ResumeAI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <i class="fa-solid fa-lock-open auth-icon"></i>
            <h2>Welcome Back</h2>
            <p>Access your resume analysis and history logs.</p>
        </div>
        
        <form id="login-form" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@company.com" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-regular fa-keyboard"></i> Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="pwd-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Login</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="/register">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
