{% extends "base.html" %}

{% block title %}Create Account - ResumeAI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <i class="fa-solid fa-user-plus auth-icon"></i>
            <h2>Create Account</h2>
            <p>Get instant ATS scores and professional analysis suggestion logs.</p>
        </div>
        
        <form id="register-form" class="auth-form">
            <div class="form-group">
                <label for="full_name"><i class="fa-regular fa-user"></i> Full Name</label>
                <input type="text" id="full_name" name="full_name" placeholder="John Doe" required>
            </div>
            
            <div class="form-group">
                <label for="email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" placeholder="john@doe.com" required>
            </div>
            
            <div class="form-group">
                <label for="password"><i class="fa-regular fa-keyboard"></i> Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Min. 8 characters" minlength="8" required>
                    <button type="button" class="pwd-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <div class="form-group">
                <label for="confirm_password"><i class="fa-solid fa-key"></i> Confirm Password</label>
                <div class="password-input-wrapper">
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" minlength="8" required>
                    <button type="button" class="pwd-toggle-btn" aria-label="Toggle Password Visibility">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                <span>Sign Up</span> <i class="fa-solid fa-user-check"></i>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Already have an account? <a href="/login">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
